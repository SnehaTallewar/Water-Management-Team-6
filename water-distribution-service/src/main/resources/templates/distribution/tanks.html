<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Water Tanks')}"></head>
<body>

<header th:replace="~{fragments :: header}"></header>

<div class="layout">
    <aside th:replace="~{fragments :: sidebar('tanks')}"></aside>

    <main class="main">
        <div th:replace="~{fragments :: flash}"></div>

        <section class="section">
            <div class="section-title">
                <h2>Water Tanks</h2>
                <a class="btn" th:href="@{/distribution/tanks/new}">+ Add Tank</a>
            </div>

            <div class="panel">
                <div class="table-wrap" th:if="${!tanks.isEmpty()}">
                    <table>
                        <thead>
                        <tr><th>ID</th><th>Name</th><th>Location</th><th>Capacity (L)</th><th>Current (L)</th><th>Level</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${tanks}" th:with="pct=${@ui.percent(t.currentLevelLitres, t.capacityLitres)}">
                            <td th:text="${t.id}"></td>
                            <td th:text="${t.name}"></td>
                            <td th:text="${t.location != null and !t.location.isEmpty() ? t.location : '—'}"></td>
                            <td th:text="${t.capacityLitres != null ? #numbers.formatDecimal(t.capacityLitres, 1, 'COMMA', 2, 'POINT') : '—'}"></td>
                            <td th:text="${t.currentLevelLitres != null ? #numbers.formatDecimal(t.currentLevelLitres, 1, 'COMMA', 2, 'POINT') : '—'}"></td>
                            <td>
                                <div class="bar-cell">
                                    <div class="bar"><span th:class="${@ui.tankBar(pct)}" th:style="'width:' + ${pct} + '%'"></span></div>
                                    <span th:text="${pct} + '%'"></span>
                                </div>
                            </td>
                            <td><span th:class="${@ui.badge(t.status)}" th:text="${t.status != null ? t.status : '—'}"></span></td>
                            <td>
                                <div class="actions">
                                    <a class="btn secondary small" th:href="@{/distribution/tanks/{id}/edit(id=${t.id})}">Edit</a>
                                    <form th:action="@{/distribution/tanks/{id}/delete(id=${t.id})}" method="post"
                                          onsubmit="return confirm('Delete this water tank?');">
                                        <button type="submit" class="btn danger small">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <p class="empty" th:if="${tanks.isEmpty()}">No water tanks yet. Add the first one to get started.</p>
            </div>
        </section>

    </main>
</div>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
