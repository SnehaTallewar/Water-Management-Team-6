<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Pipeline')}"></head>
<body>

<header th:replace="~{fragments :: header}"></header>

<div class="layout">
    <aside th:replace="~{fragments :: sidebar('pipelines')}"></aside>

    <main class="main">
        <div th:replace="~{fragments :: flash}"></div>

        <section class="section">
            <div class="section-title">
                <h2 th:text="${pageTitle}">Pipeline</h2>
            </div>

            <div class="panel form-panel">
                <form th:action="@{${formAction}}" th:object="${pipeline}" method="post">
                    <div class="form-grid">
                        <div class="field">
                            <label for="name">Name <span class="req">*</span></label>
                            <input type="text" id="name" th:field="*{name}" maxlength="255" required>
                        </div>
                        <div class="field">
                            <label for="lengthKm">Length (km)</label>
                            <input type="number" id="lengthKm" th:field="*{lengthKm}" min="0" step="0.01">
                        </div>
                        <div class="field">
                            <label for="material">Material</label>
                            <input type="text" id="material" th:field="*{material}" maxlength="255" placeholder="e.g. PVC, Steel, HDPE">
                        </div>
                        <div class="field">
                            <label for="status">Status</label>
                            <select id="status" th:field="*{status}">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="tankId">Connected tank</label>
                            <select id="tankId" name="tankId">
                                <option value="">— None —</option>
                                <option th:each="t : ${tanks}" th:value="${t.id}" th:text="${t.name}"
                                        th:selected="${pipeline.waterTank != null and pipeline.waterTank.id == t.id}"></option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="zoneId">Supply zone</label>
                            <select id="zoneId" name="zoneId">
                                <option value="">— None —</option>
                                <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.name}"
                                        th:selected="${pipeline.supplyZone != null and pipeline.supplyZone.id == z.id}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn">Save Pipeline</button>
                        <a class="btn secondary" th:href="@{/distribution/pipelines}">Cancel</a>
                    </div>
                </form>
            </div>
        </section>

    </main>
</div>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
