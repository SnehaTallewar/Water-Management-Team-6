spring.application.name=water-distribution-service

server.port=8082
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/water_distribution_db}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Thymeleaf UI ---
spring.thymeleaf.cache=false
# Base URL of the main dashboard (water-web) used by the "Back to Main Dashboard" link
web.dashboard.url=http://localhost:8090
